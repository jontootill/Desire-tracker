<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Tracker</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for data visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- Navigation Bar -->
  <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <i data-lucide="activity" class="text-indigo-600 w-6 h-6"></i>
        <h1 class="text-xl font-bold text-slate-900 tracking-tight">Daily Tracker</h1>
      </div>
      <button id="manage-questions-btn" class="flex items-center space-x-1 text-sm font-medium text-slate-600 hover:text-indigo-600 transition-colors bg-slate-100 hover:bg-indigo-50 px-3 py-1.5 rounded-lg">
        <i data-lucide="settings" class="w-4 h-4"></i>
        <span>Questions</span>
      </button>
    </div>
  </nav>

  <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-6 space-y-8">

<!-- Date & Session Selector -->
<div class="flex flex-wrap items-center gap-2 bg-slate-50 border border-slate-200 rounded-lg p-1.5">
  <div class="flex items-center space-x-1 pr-2 border-r border-slate-200">
    <i data-lucide="calendar" class="w-4 h-4 text-slate-500 ml-1"></i>
    <input type="date" id="entry-date" class="bg-transparent text-sm text-slate-700 font-medium focus:outline-none">
  </div>
  
  <!-- AM/PM Toggle Switch -->
  <div class="flex bg-slate-200/70 p-0.5 rounded-md text-xs font-semibold select-none">
    <button type="button" id="session-am" class="px-3 py-1 rounded-md transition-all duration-150 bg-white text-indigo-600 shadow-sm">
      <i data-lucide="sun" class="w-3.5 h-3.5 inline mr-1"></i> Morning
    </button>
    <button type="button" id="session-pm" class="px-3 py-1 rounded-md transition-all duration-150 text-slate-600 hover:text-slate-900">
      <i data-lucide="moon" class="w-3.5 h-3.5 inline mr-1"></i> Evening
    </button>
  </div>
</div>


      <!-- Form Inputs Container -->
      <form id="tracker-form" class="space-y-4">
        <div id="questions-inputs-container" class="space-y-4">
          <!-- Dynamic questions will load here -->
        </div>

        <div id="no-questions-notice" class="hidden text-center py-8 bg-slate-50 rounded-lg border border-dashed border-slate-200">
          <i data-lucide="help-circle" class="w-8 h-8 text-slate-400 mx-auto mb-2"></i>
          <p class="text-slate-600 font-medium">No questions configured yet.</p>
          <button type="button" id="notice-setup-btn" class="mt-2 text-sm text-indigo-600 font-semibold hover:underline">
            + Add your first question
          </button>
        </div>

        <div class="pt-2 flex justify-end">
          <button type="submit" id="save-entry-btn" class="w-full sm:w-auto px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-medium rounded-lg shadow-sm transition-all flex items-center justify-center space-x-2">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i>
            <span>Save Entry</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Section 2: Visual Trends (Charts) -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="line-chart" class="w-5 h-5 text-indigo-600"></i>
          Trends & Visuals
        </h2>
        <span class="text-xs text-slate-400 font-medium">Last 14 entries</span>
      </div>

      <div class="w-full h-64 relative">
        <canvas id="trendsChart"></canvas>
      </div>
    </section>

    <!-- Section 3: History & Log Table -->
    <section class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="history" class="w-5 h-5 text-indigo-600"></i>
          History Log
        </h2>
        <button id="export-csv-btn" class="text-xs text-slate-600 hover:text-indigo-600 font-medium flex items-center gap-1 bg-slate-100 hover:bg-indigo-50 px-2.5 py-1.5 rounded-md transition-colors">
          <i data-lucide="download" class="w-3.5 h-3.5"></i> Export CSV
        </button>
      </div>

      <div class="overflow-x-auto border border-slate-100 rounded-lg">
        <table class="w-full text-left text-sm text-slate-600">
          <thead class="bg-slate-50 text-slate-700 text-xs uppercase font-semibold border-b border-slate-200" id="history-table-head">
            <!-- Headers injected dynamically -->
          </thead>
          <tbody class="divide-y divide-slate-100" id="history-table-body">
            <!-- Table rows injected dynamically -->
          </tbody>
        </table>
      </div>
    </section>

  </main>

  <!-- Modal: Manage Questions Configuration -->
  <div id="questions-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-lg w-full p-6 space-y-5 transform transition-all">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <i data-lucide="sliders" class="w-5 h-5 text-indigo-600"></i>
          Manage Tracker Questions
        </h3>
        <button id="close-modal-btn" class="text-slate-400 hover:text-slate-600 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Add New Question Input -->
      <form id="add-question-form" class="space-y-3">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Add New Question</label>
        <div class="flex gap-2">
          <input type="text" id="new-question-text" placeholder="e.g. Hours of sleep, Water intake..." required class="flex-1 rounded-lg border-slate-300 border px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium px-4 py-2 rounded-lg text-sm flex items-center gap-1 shadow-sm transition-all">
            <i data-lucide="plus" class="w-4 h-4"></i> Add
          </button>
        </div>
      </form>

      <!-- Existing Questions List -->
      <div class="space-y-2">
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider">Current Questions</label>
        <ul id="modal-questions-list" class="space-y-2 max-h-56 overflow-y-auto pr-1">
          <!-- Dynamic list items -->
        </ul>
      </div>

      <div class="pt-2 border-t border-slate-100 flex justify-end">
        <button id="done-modal-btn" class="bg-slate-800 hover:bg-slate-900 text-white font-medium px-4 py-2 rounded-lg text-sm transition-all">
          Done
        </button>
      </div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script src="tracker.js"></script>
</body>
</html>
